name: Deploy to Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: http://145.241.226.235:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare deploy archive
        run: |
          mkdir -p /tmp/deploy
          # Copy only code files, excluding git/venv/db/caches
          rsync -a --exclude='.git' --exclude='venv' --exclude='*.db*' \
            --exclude='__pycache__' --exclude='.env' --exclude='deploy_log.txt' \
            --exclude='camera-flipper' --exclude='.github' \
            ./ /tmp/deploy/
          cd /tmp/deploy && tar -czf camera-flipper-deploy.tar.gz .
          ls -lh camera-flipper-deploy.tar.gz

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -T 10 -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts || true

      - name: Deploy to VM
        run: |
          scp -i ~/.ssh/vm_key -o ConnectTimeout=15 -o BatchMode=yes \
            /tmp/deploy/camera-flipper-deploy.tar.gz \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/camera-flipper-deploy.tar.gz

          ssh -i ~/.ssh/vm_key -o ConnectTimeout=15 -o BatchMode=yes \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} '
            set -e
            echo "STEP: extracting archive"
            cd ~/camera-flipper
            tar -xzf ~/camera-flipper-deploy.tar.gz
            echo "STEP: pip install"
            source venv/bin/activate
            pip install -q -r requirements.txt
            echo "STEP: rescore"
            python rescore.py
            echo "STEP: restart service"
            sudo systemctl restart camera-flipper
            echo "Deployment complete"
          '
